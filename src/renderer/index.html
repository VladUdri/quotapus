  }
  const rate = !f ? st("Burn rate", "\u2014", "collecting data")
    : st("Burn rate", fmtRate(f.ratePerHour, unit), ratio > 1.15 ? ratio.toFixed(1) + "\u00D7 even pace" : ratio < 0.85 ? "below even pace" : "about even pace");
  const hit = hitAt(m, asOf);
  let fc;
  if (p >= 100) fc = st("Limit", "Reached", "until the reset", true);
  else if (!f) fc = st("Forecast", "\u2014", "after 15 min");
  else if (hit) fc = st("Runs out", "~" + dtfmt(hit), dur((reset - hit) / MIN) + " till reset", true);
  else fc = st("At reset", "~" + Math.round(projectedAt(m, asOf, reset)) + "%", "won't hit the limit");
  const left = st("Resets in", dur(Math.max(0, reset - now) / MIN), dtfmt(reset));
  return el("div", "stats", undefined, [rate, fc, left]);
}

function breakdown(m) {
  const items = m.breakdown.filter((b) => b.share > 0);
  const sw = (i) => "s" + Math.min(i + 1, 4);
  const stack = el("div", "bdbar", undefined, items.map((b, i) => { const e = el("i", sw(i)); e.style.flex = String(b.share); return e; }));
  return el("div", "bd", undefined, [
    el("h4", "", "Where it went ", [el("span", "", "\u00B7 " + (m.breakdownLabel || "by project folder, share of tokens used"))]),
    stack,
    el("div", "leg2", undefined, items.map((b, i) => { const n = el("span", "n", b.name); n.title = b.path || b.name;
      return el("div", "", undefined, [el("i", "sw " + sw(i)), n, el("span", "sh", Math.round(b.share) + "%")]); })),
  ]);
}

const open = new Set();   // meters whose Runway panel is expanded
const zoom = new Set();   // meters zoomed into their recent past (long windows only)
let pendingCharts = [];   // charts are drawn after insertion, once the width is known

// Long windows get a zoom: a week -> the last 24h, a billing cycle -> the last 7 days.
const zoomOf = (m) => m.windowMinutes >= 20 * 1440 ? { full: "Month", short: "7d", span: 7 * D, title: "Last 7 days" }
  : m.windowMinutes >= 7 * 1440 ? { full: "Week", short: "24h", span: 24 * H, title: "Last 24 hours" } : null;
const windowTitle = (m) => m.windowMinutes <= 600 ? "This session" : m.windowMinutes <= 8 * 1440 ? "This week" : "This billing cycle";

function detail(key, m, asOf) {
  const d = el("div", "detail lv-" + level(clamp(m.usedPercent)) + " " + fcClass(m));
  if (!hasWindow(m)) { if (m.breakdown && m.breakdown.length) d.append(breakdown(m)); return d; }
  const z = zoomOf(m), zoomed = Boolean(z && zoom.has(key) && hasChart(m));
  const head = el("div", "dh", undefined, [el("h4", "", zoomed ? z.title : windowTitle(m))]);
  if (z && hasChart(m)) {
    const seg = el("div", "seg"); seg.setAttribute("role", "group"); seg.setAttribute("aria-label", "Chart range");
    [[z.full, false], [z.short, true]].forEach(([label, on]) => {
      const b = el("button", zoomed === on ? "on" : "", label);
      b.setAttribute("aria-pressed", String(zoomed === on));
      b.onclick = (e) => { e.stopPropagation(); on ? zoom.add(key) : zoom.delete(key); render(data); };
      seg.append(b);
    });
    head.append(seg);
  }
  d.append(head, verdict(m, asOf));
  if (hasChart(m)) {
    const holder = el("div");
    d.append(holder, el("div", "legend", undefined, [el("span", "", undefined, [el("i"), "used"]),
      ...(readings(m).some((r) => r[2]) ? [el("span", "", undefined, [el("i", "est"), "estimated"])] : []),
      ...(m.forecast ? [el("span", "", undefined, [el("i", "proj"), "projected"])] : []), el("span", "", undefined, [el("i", "even"), "even pace"])]));
    pendingCharts.push(() => holder.append(runway(m, holder.clientWidth, zoomed ? z.span : 0, asOf)));
  }
  d.append(stats(m, asOf));
  if (Array.isArray(m.daily) && m.daily.some((x) => x.v > 0)) d.append(dailyPanel(m));
  if (m.breakdown && m.breakdown.length) d.append(breakdown(m));
  return d;
}

// Usage per day over the last 14 days, from the provider's own history: averages, this week vs last week,
// the busiest day. Spend in dollars (Cursor) or tokens (Claude Code's logs).
const fmtTokens = (v) => v >= 1e9 ? (v / 1e9).toFixed(1) + "B" : v >= 1e6 ? (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + "M" : v >= 1e3 ? Math.round(v / 1e3) + "k" : String(Math.round(v));
const fmtUsd = (v) => "$" + (v >= 100 ? Math.round(v) : v.toFixed(2));
function dailyPanel(m) {
  const days = m.daily.slice(-14), usd = m.dailyUnit === "usd", fmt = usd ? fmtUsd : (v) => fmtTokens(v) + " tokens"; // 28 days arrive (for learning work days); 14 are shown
  const sum = (xs) => xs.reduce((a, b) => a + b.v, 0);
  const thisWeek = sum(days.slice(-7)), lastWeek = sum(days.slice(-14, -7));
  const busiest = days.reduce((a, b) => (b.v > a.v ? b : a));
  const today = days[days.length - 1];
  const holder = el("div", "days");
  pendingCharts.push(() => {
    const W = holder.clientWidth, HT = 48, n = days.length, gap = 3, bw = (W - gap * (n - 1)) / n, max = busiest.v || 1;
    const svg = s("svg", { width: W, height: HT + 14, viewBox: `0 0 ${W} ${HT + 14}`, role: "img", "aria-label": "Usage per day, last 14 days" }, holder);
    days.forEach((d, i) => {
      const h = d.v > 0 ? Math.max(2, (d.v / max) * HT) : 1;
      const r = s("rect", { x: i * (bw + gap), y: HT - h, width: bw, height: h, rx: Math.min(2, bw / 4), class: "dbar" + (i === n - 1 ? " today" : d === busiest ? " top" : "") }, svg);
      s("title", {}, r, new Date(d.t).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }) + ": " + fmt(d.v));
    });
    s("text", { x: 0, y: HT + 12, class: "ax" }, svg, datefmt(days[0].t));
    s("text", { x: W, y: HT + 12, class: "ax", "text-anchor": "end" }, svg, "Today");
  });
  const change = lastWeek > 0 ? Math.round(((thisWeek - lastWeek) / lastWeek) * 100) : null;
  const facts = [
    ["This week", fmt(thisWeek), change === null ? "no usage the week before" : (change >= 0 ? "+" : "") + change + "% vs last week"],
    ["Per day", fmt(sum(days) / days.length), "average, 14 days"],
    ["Today", fmt(today.v), busiest.v > 0 ? "busiest: " + dname(busiest.t) + " " + (usd ? fmtUsd : fmtTokens)(busiest.v) : ""],
  ];
  return el("div", "bd", undefined, [
    el("h4", "", "Last 14 days ", [el("span", "", "\u00B7 " + (usd ? "spend per day" : "tokens per day, from Claude Code"))]),
    holder,
    el("div", "stats", undefined, facts.map(([k, v, x]) => el("div", "stat", undefined, [el("div", "k", k), el("div", "v", v), el("div", "x", x)]))),
  ]);
}

// Click (or Enter/Space) a meter to expand its Runway panel. The chevron always sits at the far right.
function expandable(node, key, m, chevParent) {
  if (!hasDetails(m)) { chevParent.append(el("span", "nochev")); return node; }
  node.classList.add("click");
  node.tabIndex = 0; node.setAttribute("role", "button"); node.setAttribute("aria-expanded", String(open.has(key)));
  node.title = open.has(key) ? "Hide details" : "Show forecast and history";
  chevParent.append(icon("chev", "chev"));
  if (open.has(key)) node.classList.add("open");
  const toggle = () => { open.has(key) ? open.delete(key) : open.add(key); render(data); };
  node.onclick = toggle;
  node.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
  return node;
}

function hero(key, m, asOf) {
  const p = clamp(m.usedPercent), st = status(m, asOf);
  const info = el("div", "info", undefined, [
    el("div", "label", m.label),
    m.resetsAt ? el("div", "sub", countdown(m.resetsAt) + " \u00B7 " + dtfmt(Date.parse(m.resetsAt))) : null,
    st ? el("div", "status" + (st.cls ? " st-" + st.cls : ""), st.text) : null,
  ]);
  const node = el("div", "hero lv-" + level(p), undefined, [ring(key, p), info]);
  return expandable(node, key, m, node);
}

function row(key, m, asOf) {
  const p = clamp(m.usedPercent), st = status(m, asOf);
  // Calm meters show when they reset; ones that need attention say why instead (the reset is in the details).
  const sub = st && st.cls ? el("span", "sub st-" + st.cls, st.text) : el("span", "sub", countdown(m.resetsAt));
  const top = el("div", "rtop", undefined, [el("span", "label", m.label), sub, el("span", "rp", Math.round(p) + "%")]);
  const node = el("div", "row lv-" + level(p), undefined, [top, bar(key, p)]);
  return expandable(node, key, m, top);
}

function provider(p) {
  const header = el("header", "", undefined, [el("b", "", p.name), p.plan ? el("span", "badge", p.plan) : null]);
  const card = el("div", "card", undefined, [header]);
  if (p.status === "ok" && p.meters.length) {
    // the time the current values were measured (stale data is as old as its last reading)
    const asOf = (m) => { const r = readings(m); return p.stale ? (r.length ? r[r.length - 1][0] : data.lastOkAt || Date.now()) : Math.min(Date.now(), data.updatedAt || Date.now()); };
    const [first, ...rest] = p.meters;
    const k = (m) => p.id + "|" + m.label;
    card.append(hero(k(first), first, asOf(first)));
    if (open.has(k(first)) && hasDetails(first)) card.append(detail(k(first), first, asOf(first)));
    if (rest.length) card.append(el("div", "rows", undefined, rest.flatMap((m) =>
      open.has(k(m)) && hasDetails(m) ? [row(k(m), m, asOf(m)), detail(k(m), m, asOf(m))] : [row(k(m), m, asOf(m))])));
    if (p.stale) card.append(el("div", "note", undefined, [icon("alert"), el("div", "", undefined, [(p.message ?? "Couldn't refresh.") + " Showing the last known values.", actionFor(p)])]));
  } else {
    // An expected state (not set up, login expired, rate-limited) is a note, not an alarm.
    const quiet = p.status !== "error";
    card.append(el("div", "msg" + (quiet ? " quiet" : ""), undefined, [quiet ? null : icon("alert"), el("div", "", p.message ?? "No data.")]));
    const a = actionFor(p);
    if (a) card.append(a);
  }
  return card;
}

// A button that fixes the problem, when there is one.
function actionFor(p) {
  if (p.action === "open-settings") {
    const b = el("button", "action", "Open Settings");
    b.onclick = () => { view = "settings"; render(data); };
    return el("div", "actions", undefined, [b]);
  }
  if (p.action !== "refresh-login") return null;
  // "Refresh login": asks Claude Code itself to renew its login (it does so whenever it makes a request).
  const b = el("button", "action", "Refresh login");
  const hint = el("div", "sub", "Sends one tiny message through Claude Code. Uses a negligible amount of quota.");
  b.onclick = async () => {
    b.disabled = true; b.textContent = "Refreshing\u2026";
    const r = await window.quota.action(p.id, p.action);
    if (r && !r.ok) { b.disabled = false; b.textContent = "Refresh login"; hint.textContent = r.message ?? "Couldn't refresh."; hint.style.color = "var(--bad)"; }
  };
  return el("div", "actions", undefined, [b, hint]);
}

function skeleton() {
  const svg = s("svg", { viewBox: "0 0 100 100", class: "ring" });
  s("circle", { cx: 50, cy: 50, r: 46, fill: "none", "stroke-width": 8, class: "track" }, svg);
  const lines = el("div", "info", undefined, [el("div", "bar"), el("div", "bar")]);
  lines.children[0].style.width = "60%"; lines.children[1].style.cssText = "width:40%;margin-top:8px";
  return el("div", "card skel", undefined, [el("div", "hero", undefined, [svg, lines])]);
}

// Footer: calm when fresh, amber when the data is old (and when we'll try again).
function setTime() {
  const t = document.getElementById("time");
  if (!t) return;
  const now = Date.now();
  const age = data && data.lastOkAt ? now - data.lastOkAt : 0;
  const old = age > 5 * 60000;
  let text = "Loading\u2026";
  if (data && data.activeProviders === 0) { t.textContent = ""; return; } // nothing is being checked, so nothing can be out of date
  if (refreshing) text = "Updating\u2026";
  else if (data && data.updatedAt) {
    text = old ? "Last updated " + dur(age / 60000) + " ago"
      : data.lastOkAt ? "Updated " + tfmt(data.lastOkAt) : "Not updated yet";
    if (old && data.nextRefreshAt > now) text += " \u00B7 retry in " + dur((data.nextRefreshAt - now) / 60000);
  }
  t.textContent = text;
  t.classList.toggle("warn", !refreshing && Boolean(old || (data && data.updatedAt && !data.lastOkAt)));
  const r = document.getElementById("r");
  if (r) r.disabled = refreshing;
}

// The footer is rebuilt only when the view changes, so keyboard focus survives the 30s re-render.
let footFor = null;
function renderFooter() {
  if (footFor === view) return setTime();
  footFor = view;
  const f = document.getElementById("foot");
  if (view === "settings") {
    f.replaceChildren(el("small", "", "quotapus" + (version ? " v" + version : "")), el("button", "text", "Quit quotapus"));
    f.lastChild.onclick = () => window.quota.quit();
    return;
  }
  const t = el("small"); t.id = "time";
  const r = iconButton("refresh", "Refresh now", async () => {
    refreshing = true; setTime();
    try { await window.quota.refresh(); } finally { refreshing = false; setTime(); }
  });
  r.id = "r";
  f.replaceChildren(t, el("span", "btns", undefined, [r, iconButton("gear", "Settings", () => { view = "settings"; render(data); })]));
  setTime();
}

// Window height follows the content (capped by the main process; past that, the content scrolls).
function fit() {
  const b = getComputedStyle(document.body);
  window.quota.resize(document.getElementById("content").offsetHeight + document.getElementById("foot").offsetHeight + parseFloat(b.paddingTop) + parseFloat(b.paddingBottom));
  updateFade();
}
// The fade at the bottom only makes sense while there's more content below.
function updateFade() {
  const a = document.getElementById("app");
  a.classList.toggle("scrolls", a.scrollHeight - a.clientHeight > 1 && a.scrollTop + a.clientHeight < a.scrollHeight - 1);
}
window.addEventListener("resize", updateFade);
document.getElementById("app").addEventListener("scroll", updateFade);

// Dev hooks via QUOTAPUS_VIEW: "settings", "expand" (first two meters), "expand:2", "expand:1,2:zoom",
// "expand:0::1" (4th part = provider index, e.g. Cursor in mock mode).
const hash = location.hash.slice(1).split(":");
let view = hash[0] === "settings" ? "settings" : "main";
let pendingExpand = hash[0] === "expand" ? { idx: hash[1] ? hash[1].split(",").map(Number) : [0, 1], zoom: hash[2] === "24h" || hash[2] === "zoom", provider: Number(hash[3]) || 0 } : null;
let welcomeClosed = false;

// ---- settings ----
function setRow(name, desc, control, extraCls) {
  const label = el("div", "", undefined, [el("div", "name", name), desc ? el("div", "desc", desc) : null]);
  return el("div", "set" + (extraCls ? " " + extraCls : ""), undefined, [label, control]);
}
function toggle(name, on, onChange, desc) {
  const b = el("button", "switch" + (on ? " on" : "")); b.setAttribute("role", "switch"); b.setAttribute("aria-checked", String(on));
  b.setAttribute("aria-label", name); b.onclick = () => onChange(!on);
  return setRow(name, desc, b);
}
// Label on the left, choices on the right (one line, keeps the settings short).
function chips(name, options, desc, off) {
  const row = setRow(name, desc, el("div", "chips", undefined, options.map((o) => { const b = el("button", "chip" + (o.on ? " on" : ""), o.label);
    b.setAttribute("aria-pressed", String(o.on)); b.onclick = o.click; return b; })));
  if (off) row.classList.add("off");
  return row;
}
function select(name, value, options, onChange) {
  const sel = el("select", "", undefined, options.map(([v, label]) => { const o = el("option", "", label); o.value = v; return o; }));
  sel.value = value; sel.setAttribute("aria-label", name); sel.onchange = () => onChange(sel.value);
  return setRow(name, null, el("div", "select", undefined, [sel, icon("chev")]));
}
// Auto = learned from history; tapping a day switches to your own choice, starting from what was learned.
const workDaysRow = (save) => (p) => {
  const auto = !p.workDays, current = p.workDays || p.learnedDays || [1, 2, 3, 4, 5];
  const desc = auto ? (p.learnedDays ? "Learned from your history: " + daysLabel(p.learnedDays) + ". Forecasts skip the other days." : "Learning from your history (needs about two weeks). Tap days to set them now.")
    : "Set by you: " + daysLabel(p.workDays) + ". Tap Auto to learn them instead.";
  const chipsEl = el("div", "chips", undefined, [
    (() => { const b = el("button", "chip" + (auto ? " on" : ""), "Auto"); b.setAttribute("aria-pressed", String(auto)); b.onclick = () => save({ workDays: { [p.id]: null } }); return b; })(),
    ...[1, 2, 3, 4, 5, 6, 0].map((d) => {
      const on = current.includes(d);
      const b = el("button", "chip day" + (on ? (auto ? " learned" : " on") : ""), WD[d][0]);
      b.title = WD[d]; b.setAttribute("aria-label", WD[d]); b.setAttribute("aria-pressed", String(!auto && on));
      b.onclick = () => { const next = on ? current.filter((x) => x !== d) : [...current, d]; if (next.length) save({ workDays: { [p.id]: next } }); };
      return b;
    }),
  ]);
  const row = setRow(p.name, desc, chipsEl);
  row.classList.add("col");
  return row;
};
const section = (title, rows) => [el("div", "sec", title), el("div", "group", undefined, rows.filter(Boolean))];

async function renderSettings(error) {
  const st = await window.quota.getSettings();
  notifyAt = st.notifyAt || []; version = st.version || version;
  const save = async (patch) => { const r = await window.quota.setSettings(patch); renderSettings(r && r.error); };
  const meters = st.meters || [];
  document.getElementById("content").replaceChildren(...[
    el("div", "sv-head", undefined, [iconButton("back", "Back", back), el("h2", "", "Settings")]),
    error ? el("div", "seterr", undefined, [icon("alert"), el("span", "", error)]) : null,
    // One switch per provider. Off = never checked and never shown.
    ...section("Providers", (st.providers || []).map((p) => toggle(p.name, p.on, (v) => save({ providers: { [p.id]: v } }), p.detail))),
    // Work days per provider: forecasts for weekly/monthly limits skip the days you don't work.
    ...((st.providers || []).some((p) => p.on) ? section("Work days", (st.providers || []).filter((p) => p.on).map(workDaysRow(save))) : []),
    ...section("Menu bar", [
      toggle("Show percentage", st.showPercentInMenuBar, (v) => save({ showPercentInMenuBar: v })),
      meters.length > 1 ? select("Shows", st.menuBarMeter || meters[0].key, [...meters.map((m) => [m.key, m.name]), ["max", "Whichever is highest"]], (v) => save({ menuBarMeter: v })) : null,
    ]),
    ...section("Notifications", [
      toggle("Usage alerts", st.notifications, (v) => save({ notifications: v }), "Plus a heads-up when a limit is ~30 min from running out."),
      chips("Alert at", [50, 70, 80, 90, 95].map((t) => ({ label: t + "%", on: st.notifyAt.includes(t),
        click: () => save({ notifyAt: st.notifyAt.includes(t) ? st.notifyAt.filter((x) => x !== t) : [...st.notifyAt, t] }) })), null, !st.notifications),
    ]),
    ...(st.hasClaude || st.claudeStatusLine ? section("Claude Code", [
      toggle("Read limits from Claude Code", st.claudeStatusLine, (v) => save({ claudeStatusLine: v }),
        "Uses Claude Code's status line instead of Anthropic's rate-limited API. Your own status line keeps working."),
    ]) : []),
    ...section("General", [
      toggle("Launch at login", st.launchAtLogin, (v) => save({ launchAtLogin: v })),
      chips("Check every", [5, 10, 15].map((m) => ({ label: m + " min", on: st.refreshSeconds === m * 60, click: () => save({ refreshSeconds: m * 60 }) }))),
    ]),
  ].filter(Boolean));
  renderFooter();
  fit();
}
function back() { view = "main"; render(data); }

function render(d) {
  data = d;
  if (view === "settings") return renderSettings();
  if (!d) return;
  if (pendingExpand && d.results && d.results[pendingExpand.provider]) {
    const first = d.results[pendingExpand.provider];
    pendingExpand.idx.forEach((i) => { const m = first.meters[i]; if (m) { open.add(first.id + "|" + m.label); if (pendingExpand.zoom) zoom.add(first.id + "|" + m.label); } });
    pendingExpand = null;
  }
  pendingCharts = [];
  const kids = [];
  if (d.welcome && !welcomeClosed) {
    const x = iconButton("close", "Dismiss", () => { welcomeClosed = true; render(data); }); x.classList.add("x");
    kids.push(el("div", "card welcome", undefined, [el("div", "title", "Welcome to quotapus"),
      el("div", "msg", "This panel lives in your menu bar. Click any meter to see when it will run out and where the usage went. The gear below opens settings."), x]));
  }
  if (!d.updatedAt) kids.push(skeleton());
  else if (!d.results.length) {
    const allOff = d.activeProviders === 0;
    const open = el("button", "action", "Open Settings"); open.onclick = () => { view = "settings"; render(data); };
    kids.push(el("div", "card", undefined, [el("div", "title", allOff ? "All providers are off" : "Nothing to show yet"),
      el("div", "msg quiet", allOff ? "Switch on the ones you use in Settings."
        : "quotapus reads usage from Claude Code and Cursor. Sign in to either one and it will appear here, or turn off the ones you don't use in Settings."),
      el("div", "actions flush", undefined, [open])]));
  }
  else d.results.forEach((p) => kids.push(provider(p)));
  document.getElementById("content").replaceChildren(...kids);
  chartSeq = 0;
  pendingCharts.forEach((draw) => draw());
  pendingCharts = [];
  renderFooter();
  fit();
}

window.quota.getSettings().then((st) => { notifyAt = (st && st.notifyAt) || []; version = (st && st.version) || ""; if (data && view === "main") render(data); }).catch(() => {});
window.quota.get().then(render);
// In settings, an update re-renders settings in place (e.g. a provider just switched on goes from "Checking…" to its plan).
window.quota.onUpdate((d) => { data = d; render(d); });
setInterval(() => data && view === "main" && render(data), 30000); // keep countdowns and "now" fresh without re-fetching
window.quota.onOpenSettings(() => { view = "settings"; render(data); });
// Esc: leave settings, or close the popup.
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || e.target.tagName === "SELECT") return;
  if (view === "settings") back(); else window.quota.hide();
});
</script>
