// Time formats follow the user's locale.

const shown = new Map(); // last percent drawn per ring, so updates ease from the old value

  // background: future tint, gridlines at 0/50/100, labels, even pace
  if (xn < PW) s("rect", { x: Math.max(0, xn), y: mt, width: PW - Math.max(0, xn), height: Y0 - mt, class: "future" }, svg);
  s("line", { x1: 0, x2: PW, y1: yr(0.5), y2: yr(0.5), class: "grid" }, svg);
  s("line", { x1: 0, x2: PW, y1: Y0, y2: Y0, class: "base" }, svg);
  s("line", { x1: 0, x2: PW, y1: y(100), y2: y(100), class: "limit" }, svg);
  [[100, "100%"], [(lo + 100) / 2, (lo + 100) / 2 + "%"], [lo, lo ? lo + "%" : "0"]].forEach(([v, t]) => s("text", { x: PW + 6, y: y(v) + 3.5, class: "ax" }, svg, t));
  const even = (t) => ((t - ws) / span) * 100;
  s("line", { x1: x(t0), y1: y(even(t0)), x2: x(t1), y2: y(even(t1)), class: "pace" }, plot);

  // projection band (a heuristic: 0.7x..1.35x the current rate)
  const rate = f && f.ratePerHour > 0 ? f.ratePerHour : 0;
  if (rate && p < 100) {
    const up = [], lo = [];
    for (let i = 0; i <= 48; i++) {
      const t = cur[0] + ((t1 - cur[0]) * i) / 48;
      up.push([x(t), y(clamp(p + (rate * 1.35 * (t - cur[0])) / H))]);
      lo.push([x(t), y(clamp(p + (rate * 0.7 * (t - cur[0])) / H))]);
    }
    s("path", { d: pathD(up.concat(lo.reverse())) + "Z", class: "band" }, plot);
  }
  // locked out from the hit until the reset
  if (hit && hit < t1) {
    const xa = Math.max(0, x(hit)), wOut = PW - xa;
    s("rect", { x: xa, y: y(100), width: wOut, height: Y0 - y(100), fill: `url(#${id}h)` }, svg);
    const cx = (xa + PW) / 2, left = dur((reset - Math.max(hit, now)) / MIN);
    if (wOut >= 92) { s("text", { x: cx, y: yr(0.32), class: "outlbl" }, svg, "Out of quota"); s("text", { x: cx, y: yr(0.32) + 13, class: "outlbl sm" }, svg, "for " + left); }
    else if (wOut >= 40) { s("text", { x: cx, y: yr(0.32), class: "outlbl" }, svg, "Out"); s("text", { x: cx, y: yr(0.32) + 13, class: "outlbl sm" }, svg, left); }
  }

  // actual usage: drawn as measured (straight segments, points visible when sparse)
  const xy = pts.map(([t, v]) => [x(t), y(v)]);
  s("path", { d: pathD(xy) + `L${xy[xy.length - 1][0].toFixed(1)} ${Y0}L${xy[0][0].toFixed(1)} ${Y0}Z`, class: "area" }, plot);
  s("path", { d: pathD(xy), class: "line" }, plot);
  const visible = pts.filter(([t]) => t >= t0 && t <= t1);
  if (visible.length <= 16) visible.forEach(([t, v]) => s("circle", { cx: x(t), cy: y(v), r: visible.length <= 4 ? 2.6 : 1.9, class: "rd" }, svg));

  // projection line + where it lands
  let endP = null;
  if (hit && p < 100) {
    s("path", { d: pathD([[x(cur[0]), y(p)], [x(hit), y(100)]]), class: "proj" }, plot);
    s("circle", { cx: x(hit), cy: y(100), r: 3.5, class: "pdot" }, svg);
    const xh = x(hit), label = "Runs out ~" + dtfmt(hit), lw = label.length * 6;
    const anchor = xh > PW - lw / 2 ? "end" : xh < lw / 2 ? "start" : "middle";
    s("text", { x: anchor === "end" ? PW : anchor === "start" ? 0 : xh, y: y(100) - 8, class: "callout", "text-anchor": anchor }, svg, label);
  } else if (f && p < 100) {
    endP = projectedAt(m, cur[0], t1);
    s("path", { d: pathD([[x(cur[0]), y(p)], [PW, y(endP)]]), class: "proj" }, plot);
    s("circle", { cx: PW, cy: y(endP), r: 3, class: "pdot" }, svg);
    if (t1 === reset) { // label next to the end dot, wherever it doesn't cross the projection or even-pace line
      const label = "~" + Math.round(endP) + "% at reset", x1 = PW - 8, x0 = x1 - label.length * 6;
      const tAt = (px) => t0 + (px / PW) * (t1 - t0);
      const lines = [(t) => y(projectedAt(m, cur[0], t)), (t) => y(clamp(even(t)))];
      const clear = (by) => [x0, (x0 + x1) / 2, x1].every((px) => lines.every((ln) => { const ly = ln(tAt(px)); return ly < by - 13 || ly > by + 4; }));
      const by = [y(endP) - 9, y(endP) + 18, y(endP) + 32, y(endP) - 24].find((b) => b > mt + 10 && b < Y0 - 2 && clear(b));
      if (by !== undefined) s("text", { x: x1, y: by, class: "callout quiet", "text-anchor": "end" }, svg, label);
    }
  }

  // notification thresholds crossed in view
  notifyAt.forEach((n) => {
    for (let i = 1; i < pts.length; i++) {
      const [ta, a] = pts[i - 1], [tb, b] = pts[i];
      if (a < n && b >= n) {
        const t = ta + ((n - a) / (b - a)) * (tb - ta);
        if (t < t0 || t > t1) break;
        s("circle", { cx: x(t), cy: y(n), r: 2.6, class: "thr" }, svg);
        if (x(t) > 60) s("text", { x: x(t) - 5, y: y(n) - 5, class: "thrl", "text-anchor": "end" }, svg, n + "% alert");
        break;
      }
    }
  });
  if (xn >= 0 && xn <= PW) s("line", { x1: xn, x2: xn, y1: y(100), y2: Y0, class: "nowl" }, svg);
  s("circle", { cx: x(cur[0]), cy: y(p), r: 3.5, class: "dot" }, svg);

  // x axis: start · ticks · now · end, dropping labels that would collide
  const long = t1 - t0 > 12 * H, ay = HT - 6;
  const when = (t) => (long ? dname(t) + " " + hfmt(t) : tfmt(t));
  const st = { x: 0, label: when(t0), anchor: "start" };
  const nw = { x: xn, label: "now", anchor: "middle", strong: true };
  const en = { x: PW, label: t1 === reset ? "Resets " + when(t1) : when(t1), anchor: "end" };
  const ext = (o) => { const w = o.label.length * 5.6; return o.anchor === "start" ? [o.x, o.x + w] : o.anchor === "end" ? [o.x - w, o.x] : [o.x - w / 2, o.x + w / 2]; };
  const hits = (a, b) => { const A = ext(a), B = ext(b); return A[1] > B[0] - 6 && A[0] < B[1] + 6; };
  let fixed = t1 === reset ? [st, nw, en] : [st, nw]; // zoomed: ticks mark the future
  if (hits(nw, en)) { nw.anchor = "end"; nw.x -= 3; }
  if (hits(nw, en)) en.label = when(t1);
  if (hits(nw, en)) fixed = fixed.filter((o) => o !== en);
  if (hits(st, nw)) fixed = fixed.filter((o) => o !== st);
  const taken = fixed.map(ext);
  timeTicks(t0, t1).forEach((tk) => {
    const xx = x(tk.t);
    s("line", { x1: xx, x2: xx, y1: Y0, y2: Y0 + 3, class: "axtick" }, svg);
    const lx = tk.day ? xx + (x(tk.t + D) - xx) / 2 : xx;
    const e = ext({ x: lx, label: tk.label, anchor: "middle" });
    if (e[0] > 0 && e[1] < PW + 4 && !taken.some(([a, b]) => e[1] > a - 12 && e[0] < b + 12)) { taken.push(e); s("text", { x: lx, y: ay, class: "ax", "text-anchor": "middle" }, svg, tk.label); }
  });
  fixed.forEach((o) => s("text", { x: o.x, y: ay, class: "ax" + (o.strong ? " strong" : ""), "text-anchor": o.anchor }, svg, o.label));

  // hover: nearest real reading in the past, the projection in the future
  const tip = el("div", "tip"); tip.style.display = "none"; wrap.append(tip);
  const hlg = s("g", { style: "display:none" }, svg);
  const hl = s("line", { y1: y(100), y2: Y0, class: "hl" }, hlg), hd = s("circle", { r: 3, class: "dot" }, hlg);
  const hide = () => { hlg.style.display = "none"; tip.style.display = "none"; };
  const line = (strong, rest) => el("div", "", undefined, [el("b", "", strong), el("span", "", rest)]);
  function hover(px) {
    const t = t0 + (clamp(px, 0, PW) / PW) * (t1 - t0);
    let v, rows;
    if (t <= cur[0]) {
      const near = pts.reduce((a, b) => (Math.abs(b[0] - t) < Math.abs(a[0] - t) ? b : a));
      if (near[0] < t0) return hide();
      v = near[1]; px = x(near[0]);
      rows = [line(Math.round(v) + "% used", " \u00B7 " + dtfmt(near[0])), el("span", "", "Even pace: " + Math.round(clamp(even(near[0]))) + "%")];
    } else if (hit && t >= hit) {
      v = 100; rows = [line("Out of quota", " \u00B7 " + dtfmt(t)), el("span", "", "Resets " + dtfmt(reset))];
    } else if (f) {
      v = projectedAt(m, cur[0], t);
      rows = [line("~" + Math.round(v) + "%", " \u00B7 " + dtfmt(t)), el("span", "", "Projected at current rate")];
    } else return hide();
    hd.setAttribute("class", t <= cur[0] ? "dot" : "pdot");
    hlg.style.display = ""; hl.setAttribute("x1", px); hl.setAttribute("x2", px); hd.setAttribute("cx", px); hd.setAttribute("cy", y(v));
    tip.replaceChildren(...rows); tip.style.display = "";
    const tw = tip.offsetWidth;
    tip.style.left = clamp(px - tw / 2, 0, W - tw) + "px";
    tip.style.top = (y(v) < 70 ? y(v) + 12 : y(v) - 50) + "px";
  }
  const hit_area = s("rect", { x: 0, y: 0, width: PW, height: HT, fill: "transparent" }, svg);
  hit_area.addEventListener("mousemove", (e) => hover(e.clientX - svg.getBoundingClientRect().left));
  hit_area.addEventListener("mouseleave", hide);
  return wrap;
}

// One calm sentence: when it runs out and what pace would last, or where it'll end up.
function verdict(m, asOf) {
  const f = m.forecast, p = clamp(m.usedPercent), reset = Date.parse(m.resetsAt), now = Date.now();
  const v = el("div", "verdict");
  if (p >= 100) { v.append(el("b", "", "Limit reached."), " Resets " + dtfmt(reset) + ", in " + dur((reset - now) / MIN) + "."); return v; }
  if (!f) { v.textContent = "Collecting readings. A forecast appears after about 15 minutes."; return v; }
  const hit = hitAt(m, asOf);
  if (hit) {
    const unit = rateUnit(m), hoursLeft = Math.max((reset - now) / H, 1 / 60);
    const lasting = (100 - p) / hoursLeft;
    v.append(el("b", "", "Runs out ~" + dtfmt(hit)), ", " + dur((reset - hit) / MIN) + " before the reset. To last, slow to " + fmtRate(lasting, unit) + " (now " + fmtRate(f.ratePerHour, unit) + ").");
  } else {
    const end = Math.round(projectedAt(m, asOf, reset));
    v.textContent = end >= 99 ? "Close: at this pace you'll reach the limit right around the reset."
      : "On track: you'll finish at about " + end + "% when it resets.";
  }
  return v;
}

function stats(m, asOf) {
  const f = m.forecast, p = clamp(m.usedPercent), reset = Date.parse(m.resetsAt), now = Date.now();
  const evenRate = 100 / (m.windowMinutes / 60), unit = rateUnit(m);
  const st = (k, v, x, colored) => el("div", "stat", undefined, [el("div", "k", k), el("div", "v" + (colored ? " c" : ""), v), el("div", "x", x)]);
  const ratio = f ? f.ratePerHour / evenRate : 0;
  const rate = !f ? st("Burn rate", "\u2014", "collecting data")
    : st("Burn rate", fmtRate(f.ratePerHour, unit), ratio > 1.15 ? ratio.toFixed(1) + "\u00D7 even pace" : ratio < 0.85 ? "below even pace" : "about even pace");
  const hit = hitAt(m, asOf);
  let fc;
  if (p >= 100) fc = st("Limit", "Reached", "until the reset", true);
  else if (!f) fc = st("Forecast", "\u2014", "after 15 min");
  else if (hit) fc = st("Runs out", "~" + dtfmt(hit), dur((reset - hit) / MIN) + " till reset", true);
  else fc = st("At reset", "~" + Math.round(projectedAt(m, asOf, reset)) + "%", "won't hit the limit");
  const left = st("Resets in", dur(Math.max(0, reset - now) / MIN), dtfmt(reset));
  return el("div", "stats", undefined, [rate, fc, left]);
}

function breakdown(m) {
  const items = m.breakdown.filter((b) => b.share > 0);
  const sw = (i) => "s" + Math.min(i + 1, 4);
  const stack = el("div", "stack", undefined, items.map((b, i) => { const e = el("i", sw(i)); e.style.flex = String(b.share); return e; }));
  return el("div", "bd", undefined, [
    el("h4", "", "Where it went ", [el("span", "", "\u00B7 by project folder, share of tokens used")]),
    stack,
    el("div", "leg2", undefined, items.map((b, i) => { const n = el("span", "n", b.name); n.title = b.path || b.name;
      return el("div", "", undefined, [el("i", "sw " + sw(i)), n, el("span", "sh", Math.round(b.share) + "%")]); })),
  ]);
}

const open = new Set();   // meters whose Runway panel is expanded
const zoom = new Map();   // meter key -> "24h" for weekly meters zoomed in
let pendingCharts = [];   // charts are drawn after insertion, once the width is known

function detail(key, m, asOf) {
  const d = el("div", "detail lv-" + level(clamp(m.usedPercent)) + " " + fcClass(m));
  if (!hasWindow(m)) { if (m.breakdown && m.breakdown.length) d.append(breakdown(m)); return d; }
  const weekly = m.windowMinutes >= 7 * 1440, zoomed = weekly && zoom.get(key) === "24h";
  const head = el("div", "dh", undefined, [el("h4", "", zoomed ? "Last 24 hours" : "This window")]);
  if (weekly && hasChart(m)) {
    const seg = el("div", "seg"); seg.setAttribute("role", "group"); seg.setAttribute("aria-label", "Chart range");
    [["Week", null], ["24h", "24h"]].forEach(([label, v]) => {
      const b = el("button", (zoom.get(key) ?? null) === v ? "on" : "", label);
      b.setAttribute("aria-pressed", String((zoom.get(key) ?? null) === v));
      b.onclick = () => { v ? zoom.set(key, v) : zoom.delete(key); render(data); };
      seg.append(b);
    });
    head.append(seg);
  }
  d.append(head, verdict(m, asOf));
  if (hasChart(m)) {
    const holder = el("div");
    d.append(holder, el("div", "legend", undefined, [el("span", "", undefined, [el("i"), "used"]),
      ...(m.forecast ? [el("span", "", undefined, [el("i", "proj"), "projected"])] : []), el("span", "", undefined, [el("i", "even"), "even pace"])]));
    pendingCharts.push(() => holder.append(runway(m, holder.clientWidth, zoomed, asOf)));
  }
  d.append(stats(m, asOf));
  if (m.breakdown && m.breakdown.length) d.append(breakdown(m));
  return d;
}

// Click (or Enter/Space) a meter to expand its Runway panel.
function expandable(node, key, m, chevParent) {
  if (!hasDetails(m)) return node;
  node.classList.add("click");
  node.tabIndex = 0; node.setAttribute("role", "button"); node.setAttribute("aria-expanded", String(open.has(key)));
  chevParent.append(el("span", "chev", "\u203A"));
  if (open.has(key)) node.classList.add("open");
  const toggle = () => { open.has(key) ? open.delete(key) : open.add(key); render(data); };
  node.onclick = toggle;
  node.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
  return node;
}

function hero(id, m) {
  const p = clamp(m.usedPercent);
  const info = el("div", "info", undefined, [el("div", "label", m.label), el("div", "sub", countdown(m.resetsAt)), forecastLine(m, p)]);
  const node = el("div", "hero lv-" + level(p), undefined, [ring(id + m.label, p, 7, true, paceOf(m)), info]);
  return expandable(node, id + m.label, m, info.firstChild);
}

function row(id, m) {
  const p = clamp(m.usedPercent), fc = forecastLine(m, p);
  const info = el("div", "info", undefined, [el("span", "label", m.label), fc ?? (m.resetsAt ? el("span", "sub", countdown(m.resetsAt).replace("Resets", "resets")) : null)]);
  const rp = el("div", "rp", Math.round(p) + "%");
  const node = el("div", "row lv-" + level(p), undefined, [ring(id + m.label, p, 14, false, paceOf(m)), info, rp]);
  return expandable(node, id + m.label, m, rp);
}

function provider(p) {
  const header = el("header", "", undefined, [el("b", "", p.name), ...(p.plan ? [el("span", "pill", p.plan)] : [])]);
  const card = el("div", "card", undefined, [header]);
  if (p.status === "ok" && p.meters.length) {
    // the time the current values were measured (stale data is as old as its last reading)
    const asOf = (m) => { const r = readings(m); return p.stale ? (r.length ? r[r.length - 1][0] : data.lastOkAt || Date.now()) : Math.min(Date.now(), data.updatedAt || Date.now()); };
    const [first, ...rest] = p.meters;
    card.append(hero(p.id, first));
    if (open.has(p.id + first.label) && hasDetails(first)) card.append(detail(p.id + first.label, first, asOf(first)));
    if (rest.length) card.append(el("div", "rows", undefined, rest.flatMap((m) => {
      const key = p.id + m.label;
      return open.has(key) && hasDetails(m) ? [row(p.id, m), detail(key, m, asOf(m))] : [row(p.id, m)];
    })));
    if (p.stale) card.append(el("div", "note", (p.message ?? "Couldn't refresh.") + " Showing last known values."));
  } else {
    card.append(el("div", "msg" + (p.status === "error" ? " err" : ""), p.message ?? "No data."));
    if (p.action === "refresh-login") card.append(actionButton(p));
  }
  return card;
}

// "Refresh login": asks Claude Code itself to renew its login (it does so whenever it makes a request).
function actionButton(p) {
  const b = el("button", "action", "Refresh login");
  const hint = el("div", "sub", "Sends one tiny message through Claude Code. Uses a negligible amount of quota.");
  b.onclick = async () => {
    b.disabled = true; b.textContent = "Refreshing\u2026";
    const r = await window.quota.action(p.id, p.action);
    if (r && !r.ok) { b.disabled = false; b.textContent = "Refresh login"; hint.textContent = r.message ?? "Couldn't refresh."; hint.style.color = "var(--bad)"; }
  };
  return el("div", "", undefined, [b, hint]);
}

function skeleton() {
  const svg = s("svg", { viewBox: "0 0 100 100" });
  s("circle", { cx: 50, cy: 50, r: 46.5, fill: "none", "stroke-width": 7, class: "track" }, svg);
  const lines = el("div", "info", undefined, [el("div", "bar"), el("div", "bar")]);
  lines.children[0].style.width = "60%"; lines.children[1].style.cssText = "width:40%;margin-top:8px";
  return el("div", "card skel", undefined, [el("div", "hero", undefined, [svg, lines])]);
}

// Footer: calm when fresh, amber when the data is old (and when we'll try again).
function setTime() {
  const t = document.getElementById("time");
  const now = Date.now();
  const age = data && data.lastOkAt ? now - data.lastOkAt : 0;
  const old = age > 5 * 60000;
  let text = "Loading…";
  if (refreshing) text = "Updating…";
  else if (data && data.updatedAt) {
    text = old ? "Last updated " + dur(age / 60000) + " ago"
      : data.lastOkAt ? "Updated " + tfmt(data.lastOkAt) : "Not updated yet";
    if (old && data.nextRefreshAt > now) text += " \u00B7 retry in " + dur((data.nextRefreshAt - now) / 60000);
  }
  t.textContent = text;
  t.classList.toggle("warn", !refreshing && Boolean(old || (data && data.updatedAt && !data.lastOkAt)));
}

// Dev hooks via QUOTAPUS_VIEW: "settings", "expand" (first two meters), "expand:2" or "expand:1,2:24h".
const hash = location.hash.slice(1).split(":");
let view = hash[0] === "settings" ? "settings" : "main";
let pendingExpand = hash[0] === "expand" ? { idx: hash[1] ? hash[1].split(",").map(Number) : [0, 1], zoom: hash[2] === "24h" } : null;

function toggle(name, on, onChange, desc) {
  const b = el("button", "switch" + (on ? " on" : "")); b.setAttribute("role", "switch"); b.setAttribute("aria-checked", String(on));
  b.setAttribute("aria-label", name); b.onclick = () => onChange(!on);
  const label = el("div", "", undefined, [el("div", "name", name), ...(desc ? [el("div", "desc", desc)] : [])]);
  return el("div", "set", undefined, [label, b]);
}
function chips(name, options) {
  return el("div", "set stack", undefined, [el("span", "name", name), el("div", "chips", undefined,
    options.map((o) => { const b = el("button", "chip" + (o.on ? " on" : ""), o.label); b.onclick = o.click; return b; }))]);
}
async function renderSettings(error) {
  const s = await window.quota.getSettings();
  notifyAt = s.notifyAt || [];
  const save = async (patch) => { const r = await window.quota.setSettings(patch); renderSettings(r && r.error); };
  const app = document.getElementById("app");
  app.replaceChildren(el("div", "card", undefined, [
    el("div", "title", "Settings"),
    ...(error ? [el("div", "seterr", error)] : []),
    toggle("Read limits from Claude Code", s.claudeStatusLine, (v) => save({ claudeStatusLine: v }),
      "Adds a status line to Claude Code's settings so quotapus needn't call Anthropic's API. Avoids rate limits. Your existing status line keeps working."),
    toggle("Percentage in menu bar", s.showPercentInMenuBar, (v) => save({ showPercentInMenuBar: v })),
    toggle("Usage notifications", s.notifications, (v) => save({ notifications: v })),
    toggle("Launch at login", s.launchAtLogin, (v) => save({ launchAtLogin: v })),
    chips("Refresh every", [5, 10, 15].map((m) => ({ label: m + " min", on: s.refreshSeconds === m * 60, click: () => save({ refreshSeconds: m * 60 }) }))),
    chips("Notify at", [50, 70, 80, 90, 95].map((t) => ({ label: t + "%", on: s.notifyAt.includes(t),
      click: () => save({ notifyAt: s.notifyAt.includes(t) ? s.notifyAt.filter((x) => x !== t) : [...s.notifyAt, t] }) }))),
  ]));
  document.getElementById("time").textContent = "";
  window.quota.resize(document.body.scrollHeight);
}

function render(d) {
  data = d;
  if (view === "settings") return renderSettings();
  if (pendingExpand && d.results && d.results[0]) {
    const first = d.results[0];
    pendingExpand.idx.forEach((i) => { const m = first.meters[i]; if (m) { open.add(first.id + m.label); if (pendingExpand.zoom) zoom.set(first.id + m.label, "24h"); } });
    pendingExpand = null;
  }
  const app = document.getElementById("app");
  pendingCharts = [];
  const kids = [];
  if (d.welcome) kids.push(el("div", "card", undefined, [
    el("div", "title", "Welcome to quotapus"),
    el("div", "msg", "Quotapus lives in your menu bar. Click the icon to open this panel; right-click it for settings."),
  ]));
  if (!d.updatedAt) kids.push(skeleton());
  else if (!d.results.length) kids.push(el("div", "card", undefined, [el("div", "title", "Nothing to show yet"),
    el("div", "msg", "quotapus reads usage from Claude Code and Cursor. Sign in to either one and it will appear here.")]));
  else d.results.forEach((p) => kids.push(provider(p)));
  app.replaceChildren(...kids);
  chartSeq = 0;
  pendingCharts.forEach((draw) => draw());
  pendingCharts = [];
  setTime();
  window.quota.resize(document.body.scrollHeight);
}

window.quota.getSettings().then((s) => { notifyAt = (s && s.notifyAt) || []; if (data && view === "main") render(data); }).catch(() => {});
window.quota.get().then(render);
window.quota.onUpdate(render);
setInterval(() => data && view === "main" && render(data), 30000); // keep countdowns and "now" fresh without re-fetching
document.getElementById("r").onclick = async () => {
  refreshing = true; setTime();
  try { await window.quota.refresh(); } finally { refreshing = false; setTime(); }
};
document.getElementById("gear").onclick = () => { view = view === "settings" ? "main" : "settings"; render(data); };
window.quota.onOpenSettings(() => { view = "settings"; render(data); });
document.getElementById("more").onclick = () => window.quota.menu();
</script>
