<!doctype html>
<meta charset="utf-8">
<!-- Turns the recorded JPEG frames into an H.264 MP4 with the browser's own encoder (WebCodecs) and mp4-muxer.
     Runs in a trusted, local-only window with Node access (see scripts/make-promo.js). -->
<script src="music.js"></script>
<script>
const fs = require("node:fs"), path = require("node:path");
const { Muxer, ArrayBufferTarget } = require(path.join(process.cwd(), "node_modules/mp4-muxer"));

window.encode = async ({ frames, fps, width, height, out, bitrate, marks }) => {
  const SR = 48000;
  const music = marks ? await renderMusic(frames.length / fps, marks, SR) : null;
  const muxer = new Muxer({ target: new ArrayBufferTarget(), video: { codec: "avc", width, height, frameRate: fps },
    audio: music ? { codec: "aac", numberOfChannels: 2, sampleRate: SR } : undefined, fastStart: "in-memory" });
  let failed = null;
  if (music) {
    const aenc = new AudioEncoder({ output: (chunk, meta) => muxer.addAudioChunk(chunk, meta), error: (e) => { failed = e; } });
    aenc.configure({ codec: "mp4a.40.2", sampleRate: SR, numberOfChannels: 2, bitrate: 192000 });
    const L = music.getChannelData(0), R = music.getChannelData(1), N = 1024;
    for (let i = 0; i < L.length; i += N) {
      const n = Math.min(N, L.length - i), planar = new Float32Array(n * 2);
      planar.set(L.subarray(i, i + n), 0); planar.set(R.subarray(i, i + n), n);
      const ad = new AudioData({ format: "f32-planar", sampleRate: SR, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(i * 1e6 / SR), data: planar });
      aenc.encode(ad); ad.close();
    }
    await aenc.flush();
    if (failed) throw failed;
    // loudness per second, so the mix can be checked without listening
    window.levels = Array.from({ length: Math.floor(L.length / SR) }, (_, s) => { let q = 0; for (let i = s * SR; i < (s + 1) * SR; i++) q += L[i] * L[i]; return Math.round(20 * Math.log10(Math.sqrt(q / SR) + 1e-9)); });
  }
  const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: (e) => { failed = e; } });
  enc.configure({ codec: "avc1.640028", width, height, bitrate, framerate: fps, avc: { format: "avc" } });
  let lastFile = null, bmp = null;
  for (let i = 0; i < frames.length; i++) {
    if (failed) throw failed;
    if (frames[i] !== lastFile) {
      bmp?.close();
      bmp = await createImageBitmap(new Blob([fs.readFileSync(frames[i])], { type: "image/jpeg" }), { resizeWidth: width, resizeHeight: height, resizeQuality: "high" });
      lastFile = frames[i];
    }
    const vf = new VideoFrame(bmp, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
    enc.encode(vf, { keyFrame: i % (fps * 2) === 0 });
    vf.close();
    while (enc.encodeQueueSize > 6) await new Promise((r) => setTimeout(r, 2));
  }
  await enc.flush();
  if (failed) throw failed;
  muxer.finalize();
  fs.writeFileSync(out, Buffer.from(muxer.target.buffer));
  return fs.statSync(out).size;
};
</script>
